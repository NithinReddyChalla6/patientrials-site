name: CI

# The checks that were only ever run by hand. Running them on every push and
# pull request is what would have caught, for one, a server that shipped
# without its signing secret — a green local machine is not a green branch.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
